<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آخر الإعلانات · رادار المانحين</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/radar-shell.css"><link rel="stylesheet" href="/radar-monitor.css">
<script src="/radar-shell-data.js"></script><script src="/radar-shell.js"></script>
</head><body><div id="page-content">
<div class="page-heading"><div><h2>آخر الإعلانات</h2><p class="lede">كل ما رصده النظام من المصادر الرسمية مرتبًا بالأحدث. ما يحمل «بانتظار المراجعة» لم يعتمده أحد بعد، و«فهرس محتمل» صفحة قوائم لا إعلان.</p></div><div class="row"><a class="btn ghost" href="/workflow">الفرص والمطابقة</a></div></div>
<p id="message" class="status error" role="status" hidden></p>
<div class="panel"><div class="metrics-strip" id="kpis"></div><p class="muted" id="runs" style="margin:6px 0 0;font-size:13px"></p></div>
<div class="panel"><h3>الإعلانات <small id="count"></small></h3><div class="filters"><select id="donor" aria-label="الجهة"><option value="">كل الجهات</option></select><select id="status" aria-label="الحالة"><option value="">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="approved">معتمدة</option></select><label><input type="checkbox" id="hideIndex" checked> إخفاء صفحات الفهرس</label><input id="q" type="search" placeholder="بحث في العناوين" aria-label="بحث في العناوين"></div><div id="list" class="list"><p class="empty">جارٍ التحميل…</p></div></div>
<div class="two"><div class="panel"><h3>تنبيهات مفتوحة <small id="alertCount"></small></h3><div id="monitorAlerts" class="list"></div></div><div class="panel"><h3>المصادر النشطة</h3><p id="sources" class="muted" style="margin:0;font-size:13px;line-height:1.9"></p></div></div>
</div>
<script>
'use strict';
let data,session;const $=id=>document.getElementById(id),el=(t,text,cls)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const fmt=iso=>iso?new Date(iso).toLocaleString('ar-SA-u-nu-latn',{calendar:'gregory',dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}):'—';
const statusName={pending:'بانتظار المراجعة',approved:'معتمدة'},statusCls={pending:'warn',approved:'good'};
function notice(t,cls){const m=$('message');m.hidden=!t;m.textContent=t||'';m.className='status '+(cls||'error');}
function render(){const d=$('donor').value,s=$('status').value,hide=$('hideIndex').checked,q=$('q').value.trim();const list=$('list');list.replaceChildren();
 const byDonor=i=>!d||(d.startsWith('name:')?i.donor===d.slice(5):i.donorId===d);
 const items=data.items.filter(i=>byDonor(i)&&(!s||i.status===s)&&(!hide||i.hint!=='index')&&(!q||i.title.includes(q)));$('count').textContent=items.length+' من '+data.items.length;
 for(const i of items){const row=el('div',undefined,'item');const left=el('div');const h=el('h3');const a=el('a',i.title);a.href=i.url;a.rel='noopener noreferrer';a.target='_blank';h.append(a);left.append(h);
  const b=el('div',undefined,'chips');b.append(el('span',statusName[i.status]||i.status,'chip '+(statusCls[i.status]||'')));if(i.hint==='index')b.append(el('span','فهرس محتمل','chip'));if(i.duplicateOf)b.append(el('span','مكررة','chip crit'));if(i.closesAt)b.append(el('span','الإغلاق '+i.closesAt,'chip info'));if(i.sourceKind==='feed')b.append(el('span','RSS','chip'));if(i.sourceKind==='manual')b.append(el('span','إدخال يدوي','chip'));left.append(b);
  left.append(el('div',(i.donor||'جهة غير محددة')+' · المصدر: '+i.source,'meta'));
  const t=el('div',undefined,'time');t.append(el('span','رُصد '+fmt(i.createdAt)));if(i.lastSeenAt)t.append(el('span','آخر فحص '+fmt(i.lastSeenAt)));row.append(left,t);list.append(row);}
 if(!items.length)list.append(el('p','لا إعلانات مطابقة للمرشحات الحالية.','empty'));}
function metric(icon,value,label,sub){const m=el('div',undefined,'metric');const s=el('span');s.innerHTML=(window.radarIcon?radarIcon(icon):'')+' ';s.append(document.createTextNode(label));m.append(s,el('b',String(value)));if(sub)m.append(el('small',sub));return m;}
async function load(){const r=await fetch('/api/news');if(!r.ok)throw Error('تعذر تحميل الإعلانات أو انتهت الجلسة');data=await r.json();
 const active=data.sources.filter(s=>s.active),last=data.runs[0],win=data.scheduled[0];
 const real=data.items.filter(i=>i.hint!=='index'),pending=real.filter(i=>i.status==='pending');
 $('kpis').replaceChildren(metric('opportunities',real.length,'إعلانات مرصودة',data.items.length-real.length?'+ '+(data.items.length-real.length)+' صفحات فهرس':''),metric('pipeline',pending.length,'بانتظار المراجعة',real.filter(i=>i.status==='approved').length+' معتمدة'),metric('sources',active.length,'مصادر نشطة',data.sources.filter(s=>s.failures>0).length+' تحتاج انتباهًا'),metric('bell',data.alerts.length,'تنبيهات مفتوحة'));
 $('runs').textContent=last?('آخر جولة فحص: '+fmt(last.started_at)+' — فُحص '+last.checked+'، نجح '+last.succeeded+'، فشل '+last.failed+(win?' · آخر نافذة مجدولة: '+fmt(win.created_at)+' ('+({done:'اكتملت',failed:'فشلت',busy:'مشغول',running:'قيد التنفيذ'})[win.status]+')':'')):'لم تجرِ أي جولة فحص بعد.';
 if(window.radarShellFooter)radarShellFooter('آخر رصد حي: '+(last?fmt(last.started_at):'—'));if(window.radarShellCount)radarShellCount('news',pending.length||null);
 const sel=$('donor'),cur=sel.value;sel.replaceChildren(el('option','كل الجهات'));sel.firstChild.value='';const used=new Set(data.items.map(i=>i.donorId).filter(Boolean));for(const d of data.donors.filter(d=>used.has(d.id))){const o=el('option',d.name);o.value=d.id;sel.append(o);}const extra=[...new Set(data.items.filter(i=>!i.donorId&&i.donor).map(i=>i.donor))];for(const name of extra){const o=el('option',name);o.value='name:'+name;sel.append(o);}sel.value=cur;
 const alerts=data.alerts.filter(a=>session.user.role==='admin'||!['scan_error','policy_stale'].includes(a.kind));$('alertCount').textContent=alerts.length?alerts.length+' مفتوحة':'';
 $('monitorAlerts').replaceChildren(...(alerts.length?alerts.slice(0,25).map(a=>{const row=el('div',undefined,'item');const left=el('div');left.append(el('div',a.message,'meta'));left.firstChild.style.color='var(--ink)';row.append(left,el('div',fmt(a.created_at),'time'));return row;}):[el('p','لا تنبيهات مفتوحة.','empty')]));
 $('sources').textContent=active.length?active.map(s=>(s.donor||s.name.replace(/ — .*$/,''))+(s.last_checked?' (آخر فحص '+fmt(s.last_checked)+')':' (لم يُفحص بعد)')).join(' · '):'لا مصادر نشطة؛ تحتاج المصادر إلى مراجعة السياسات في مركز الرصد.';
 render();}
(async()=>{session=await (await fetch('/api/session')).json();if(!session.user)throw Error('انتهت الجلسة؛ سجّل الدخول مجددًا.');radarShell({page:'news',title:'آخر الإعلانات',role:session.user.role});
 for(const id of ['donor','status','hideIndex','q'])$(id).addEventListener('input',render);
 await load();})().catch(e=>{document.body.innerHTML='';const p=document.createElement('p');p.className='status error';p.textContent=e.message;document.body.append(p);});
</script></body></html>

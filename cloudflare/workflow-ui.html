<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفرص والمطابقة · رادار المانحين</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/radar-shell.css"><link rel="stylesheet" href="/radar-monitor.css">
<script src="/radar-shell-data.js"></script><script src="/radar-shell.js"></script>
</head><body><div id="page-content">
<div class="page-heading"><div><h2>الفرص والمطابقة</h2><p class="lede">تُراجع الفرصة قبل ظهورها للفريق. المطابقة ترشيح يحتاج تحققًا من الأهلية. قبول الطلب هنا لا يسجل تمويلًا ماليًا.</p></div><div class="row"><a class="btn ghost" href="/news">آخر الإعلانات</a><a class="btn ghost" id="monitor-link" href="/monitor" hidden>مركز الرصد</a></div></div>
<p id="message" class="status" role="status" hidden></p>
<div class="panel"><h3>تنبيهات الرصد <small id="alertCount"></small><span style="margin-inline-start:auto"><button type="button" class="btn ghost small" id="ackAll" hidden>تم الاطلاع على الكل</button></span></h3><div id="monitorAlerts" class="list"></div></div>
<div class="panel"><h3>طلبات التقديم والمهام <small id="appCount"></small><label style="margin-inline-start:auto;font-weight:400;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="mine"> مهامي فقط</label></h3><div id="applications" class="entries"></div></div>
<div class="panel"><h3>الفرص والمطابقة <small id="oppCount"></small></h3><div id="opportunities" class="entries"><p class="empty">جارٍ التحميل…</p></div></div>
</div>
<script>
'use strict';
let session,data;const $=id=>document.getElementById(id),el=(t,text,cls)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const fmt=iso=>iso?new Date(iso).toLocaleString('ar-SA-u-nu-latn',{calendar:'gregory',dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}):'—';
function notice(t,ok){const m=$('message');m.hidden=!t;m.textContent=t||'';m.className='status '+(ok?'ok':'error');if(t)m.scrollIntoView({block:'nearest'});}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':session.csrfToken}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل البيانات');return d;}
function field(form,name,label,value='',options){const l=el('label',label),n=el(options?'select':'input');n.name=name;if(options)for(const [v,t]of options){const o=el('option',t);o.value=v;n.append(o);}n.value=value;l.append(n);form.append(l);return n;}
function chips(form,name,legend,options,chosen=[]){const f=el('fieldset');f.append(el('legend',legend));const box=el('div',undefined,'chips-pick');for(const [v,t] of options){const l=el('label'),c=el('input');c.type='checkbox';c.name=name;c.value=v;c.checked=chosen.includes(v);l.append(c,el('span',t));box.append(l);}f.append(box);form.append(f);}
const picked=(form,name)=>[...form.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value);
const num=v=>v===''||v===undefined?null:Number(v);
const quoteOf=e=>(Array.isArray(e.excerpt)?e.excerpt.map(x=>x.quote||x.date||'').filter(Boolean).join(' | '):String(e.excerpt||'')).slice(0,60);
function link(url,label){const a=el('a',label);a.href=url;a.rel='noopener noreferrer';a.target='_blank';return a;}
function submit(form,label,fn){const actions=el('div',undefined,'actions');const b=el('button',label,'btn');actions.append(b);form.append(actions);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await fn(Object.fromEntries(new FormData(form)));notice('تم الحفظ',true);await load();}catch(e){notice(e.message);}finally{b.disabled=false;}};}
const stageNames={eval:'تقييم',prep:'تجهيز',sent:'قُدم',accepted:'مقبول',rejected:'مرفوض',closed:'مغلق'},evNames={stage:'مرحلة',contact:'تواصل',note:'ملاحظة',result:'نتيجة'},verdictNames={candidate_ok:'مرشح مناسب — يحتاج تحققًا بشريًا',needs_review:'ينقصه توثيق',blocked:'غير مناسب حاليًا'},verdictCls={candidate_ok:'good',needs_review:'warn',blocked:'crit'},stNames={met:'متحقق',unmet:'غير متحقق',unknown:'غير موثق'};
function chip(text,cls){return el('span',text,'chip'+(cls?' '+cls:''));}
function applicationForm(parent,o,app,projectId,prep){if(session.user.role==='viewer')return;const f=el('form',undefined,'grid');field(f,'projectId','المشروع',app?.project_id||projectId||'',data.projects.map(p=>[p.id,p.name]));field(f,'ownerId','المسؤول',app?.owner_id||session.user.id,data.members.map(m=>[m.id,m.displayName]));field(f,'stage','المرحلة',app?.stage||(prep?'prep':'eval'),Object.entries(stageNames).filter(([k])=>session.user.role==='admin'||k!=='accepted'));field(f,'nextAction','الخطوة التالية',app?.next_action||'');field(f,'dueDate','موعد المهمة',app?.due_date||'').type='date';field(f,'notes','ملاحظات المتابعة',app?.notes||'');if(app)f.elements.projectId.disabled=true;submit(f,app?'حفظ المتابعة':prep?'بدء التجهيز للنافذة القادمة':'بدء تقييم مستقل',v=>api('/api/workflow/applications',{...v,projectId:app?.project_id||v.projectId,opportunityId:o.id,expectedVersion:app?.version||0}));parent.append(f);}
function eventForm(parent,app){if(session.user.role==='viewer')return;const f=el('form',undefined,'grid');field(f,'kind','نوع السجل','contact',[['contact','تواصل مع الجهة'],['note','ملاحظة'],['result','نتيجة الطلب']]);field(f,'result','النتيجة (للنتائج فقط)','',[['','—'],...(session.user.role==='admin'?[['accepted','مقبول']]:[]),['rejected','مرفوض']]);field(f,'text','التفاصيل','');submit(f,'تسجيل',v=>{const b={kind:v.kind,text:v.text};if(v.kind==='result')b.result=v.result;return api('/api/workflow/applications/'+app.id+'/events',b);});parent.append(f);}
function timeline(parent,app){const ul=el('ul',undefined,'tl');for(const e of data.events[app.id]||[]){const li=el('li');li.append(el('time',fmt(e.at)),el('b',(evNames[e.kind]||e.kind)+' · '+(e.actor_name||'')),document.createTextNode(' — '+(e.text||'')));ul.append(li);}if(!ul.children.length)ul.append(el('li','لا سجل بعد'));parent.append(ul);}
function renderAlerts(){const area=$('monitorAlerts');area.replaceChildren();const alerts=(data.alerts||[]).filter(a=>session.user.role==='admin'||!['scan_error','policy_stale'].includes(a.kind));$('alertCount').textContent=alerts.length?alerts.length+' مفتوحة':'';$('ackAll').hidden=session.user.role==='viewer'||!alerts.length;
 for(const a of alerts.slice(0,40)){const row=el('div',undefined,'item');const left=el('div');const m=el('div',a.message,'meta');m.style.color='var(--ink)';left.append(m,el('div',fmt(a.created_at),'meta'));row.append(left);if(session.user.role!=='viewer'){const b=el('button','تم الاطلاع','btn ghost small');b.onclick=async()=>{try{await api('/api/workflow/alerts/'+a.id+'/ack',{});await load();}catch(e){notice(e.message);}};row.append(b);}area.append(row);}
 if(!alerts.length)area.append(el('p','لا تنبيهات مفتوحة.','empty'));}
function renderApplications(){const area=$('applications');area.replaceChildren();const list=data.applications.filter(a=>!$('mine').checked||a.owner_id===session.user.id);$('appCount').textContent=list.length?list.length+' طلب':'';
 for(const a of list){const o=data.opportunities.find(o=>o.id===a.opportunity_id)||{id:a.opportunity_id,title:'فرصة لم تعد منشورة'},p=data.projects.find(p=>p.id===a.project_id);const box=el('article',undefined,'entry');box.append(el('h3',o.title+' — '+(p?.name||a.project_id)));const c=el('div',undefined,'chips');c.append(chip(stageNames[a.stage]||a.stage,a.stage==='accepted'?'good':a.stage==='rejected'?'crit':'brand'),chip(data.members.find(m=>m.id===a.owner_id)?.displayName||'مسؤول غير نشط'),chip(a.due_date?'الموعد '+a.due_date:'لم يحدد موعد',a.due_date?'info':''));box.append(c,el('p',a.next_action,'muted'));
  const tl=el('details',undefined,'card');tl.append(el('summary','سجل المتابعة والتواصل والنتائج'));const tb=el('div',undefined,'body');timeline(tb,a);eventForm(tb,a);tl.append(tb);box.append(tl);
  if(o.review_status==='approved'){const d=el('details',undefined,'card');d.append(el('summary','تحديث المتابعة'));const db=el('div',undefined,'body');applicationForm(db,o,a);d.append(db);box.append(d);}else box.append(el('p','المتابعة محفوظة؛ يلزم إعادة اعتماد الفرصة لتعديلها.','muted'));area.append(box);}
 if(!list.length)area.append(el('p','لا توجد طلبات بعد. اختر فرصة معتمدة وابدأ تقييم مشروع.','empty'));}
function reviewForm(parent,o){const f=el('form',undefined,'grid'),meta=JSON.parse(o.fields_json||'{}'),t=o.terms,E=data.enums,acc=(data.evidence||[]).filter(e=>e.opportunity_id===o.id&&e.review_status==='accepted');
 field(f,'donorId','الجهة المانحة',o.donor_id||'',[['','غير مدرجة في الدليل — اكتب اسمها'],...data.donors.map(d=>[d.id,d.name])]);field(f,'donorName','اسم الجهة المانحة إن لم تكن في الدليل',o.donorName||'');
 chips(f,'topics','المجالات',Object.entries(data.tags||{}).map(([k,v])=>[k,typeof v==='string'?v:k]),meta.topics||[]);
 chips(f,'entityTypes','الجهات المؤهلة',Object.entries(E.entityTypes),t.entityTypes);chips(f,'audiences','الفئات المستهدفة',Object.entries(E.audiences),t.audiences);chips(f,'readiness','متطلبات الجاهزية',Object.entries(E.readiness),t.readiness);
 field(f,'scope','النطاق الجغرافي',t.region.scope,[['unknown','غير موثق'],['national','المملكة'],['regional','مناطق محددة']]);field(f,'regionNames','المناطق (مفصولة بفاصلة)',t.region.names.join('، '));
 field(f,'amountMin','أدنى مبلغ (ريال)',t.amount.min??'').type='number';field(f,'amountMax','أعلى مبلغ (ريال)',t.amount.max??'').type='number';field(f,'durMin','أقل مدة (أشهر)',t.durationMonths.min??'').type='number';field(f,'durMax','أطول مدة (أشهر)',t.durationMonths.max??'').type='number';
 field(f,'applicationStatus','حالة التقديم',t.applicationStatus,Object.entries(E.appStatus));field(f,'termsEvidence','نص الدليل على الشروط (اقتباس موجز)',t.evidence?.amount||'');
 field(f,'evidenceId','دليل التاريخ المعتمد',o.evidence_id||'',[['','بلا دليل (يلزم سبب)'],...acc.map(e=>[e.id,(e.closes_at||'بلا تاريخ')+' — '+quoteOf(e)])]);field(f,'noEvidenceReason','سبب غياب الدليل (10 أحرف فأكثر)','');
 field(f,'notes','ملاحظات التحقق',meta.notes||'');
 field(f,'decision','القرار',o.review_status==='rejected'?'rejected':'approved',[['approved','اعتماد ونشر للفريق'],['rejected','رفض / سحب'],['duplicate','تكرار لفرصة أخرى']]);
 field(f,'duplicateOf','الفرصة الأصلية (للتكرار)',o.duplicate_of||'',[['','—'],...data.opportunities.filter(x=>x.id!==o.id).map(x=>[x.id,x.title])]);
 submit(f,'حفظ المراجعة',v=>{if(v.decision==='rejected')return api('/api/workflow/opportunities/'+o.id,{decision:'rejected',expectedVersion:o.version});if(v.decision==='duplicate')return api('/api/workflow/opportunities/'+o.id,{decision:'duplicate',duplicateOf:v.duplicateOf,expectedVersion:o.version});
  const names=v.regionNames.split(/[,،]/).map(x=>x.trim()).filter(Boolean),terms={entityTypes:picked(f,'entityTypes'),audiences:picked(f,'audiences'),readiness:picked(f,'readiness'),region:{scope:v.scope,names},amount:{min:num(v.amountMin),max:num(v.amountMax)},durationMonths:{min:num(v.durMin),max:num(v.durMax)},applicationStatus:v.applicationStatus,evidence:v.termsEvidence?{amount:v.termsEvidence}:{}};
  const b={decision:'approved',donorId:v.donorId,topics:picked(f,'topics'),notes:v.notes,terms,expectedVersion:o.version};if(!v.donorId)b.donorName=v.donorName;if(v.evidenceId)b.evidenceId=v.evidenceId;else b.noEvidenceReason=v.noEvidenceReason;return api('/api/workflow/opportunities/'+o.id,b);});parent.append(f);}
function matchRow(o,m){const row=el('article',undefined,'entry');row.append(el('h3',m.name));const c=el('div',undefined,'chips');c.append(chip(verdictNames[m.verdict],verdictCls[m.verdict]),chip('تغطية التوثيق '+m.coverage+'%'));row.append(c);if(m.closed)row.append(el('p',o.closes_at?'انتهى الموعد المعتمد؛ تحقق من التجديد':'التقديم مغلق بحسب المراجعة؛ تابع النافذة القادمة','muted'));
 const d=el('details',undefined,'card');d.append(el('summary','تفصيل المعايير'));const ul=el('ul',undefined,'criteria');for(const cr of m.criteria){const li=el('li',undefined,cr.status);li.append(el('b',cr.label+': '),document.createTextNode(stNames[cr.status]+' — '+cr.detail));ul.append(li);}const db=el('div',undefined,'body');db.append(ul);d.append(db);row.append(d);if(m.blockers.length)row.append(el('p','موانع: '+m.blockers.join('؛ '),'muted'));
 const existing=data.applications.find(a=>a.project_id===m.projectId&&a.opportunity_id===o.id);if(existing)row.append(el('p','توجد متابعة لهذا المشروع في طلبات التقديم أعلاه','muted'));else if(m.verdict!=='blocked')applicationForm(row,o,null,m.projectId);else if(m.closed&&m.criteria.every(c=>c.status!=='unmet'||c.key==='status')){row.append(el('p','التقديم مغلق الآن والمعايير الأخرى لا تمنع؛ يمكن بدء التجهيز للنافذة القادمة دون تقديم.','muted'));applicationForm(row,o,null,m.projectId,true);}return row;}
async function load(){data=await api('/api/workflow');renderAlerts();renderApplications();const area=$('opportunities');area.replaceChildren();$('oppCount').textContent=data.opportunities.length?data.opportunities.length+' فرصة':'';
 if(window.radarShellCount)radarShellCount('workflow',data.opportunities.filter(o=>o.review_status==='pending').length||null);
 for(const o of data.opportunities){const box=el('article',undefined,'entry');box.id='opportunity-'+o.id;box.append(el('h3',o.title));const c=el('div',undefined,'chips');
  const st=({approved:['معتمدة','good'],pending:['بانتظار المراجعة','warn'],rejected:['مرفوضة','crit']})[o.review_status];if(st)c.append(chip(st[0],st[1]));if(o.duplicate_of)c.append(chip('مكررة','crit'));if(JSON.parse(o.fields_json||'{}').hint==='index')c.append(chip('فهرس محتمل'));c.append(chip(data.enums.appStatus[o.status],o.status==='open'?'good':o.status==='closed'?'crit':''));if(o.closes_at)c.append(chip('الإغلاق '+o.closes_at,'info'));const dn=o.donorName||(data.donors.find(d=>d.id===o.donor_id)||{}).name;if(dn)c.append(chip(dn,'brand'));box.append(c);
  const meta=el('p',undefined,'muted');meta.append(link(o.source_url,'فتح إعلان المصدر'));box.append(meta);if(o.duplicate_of){const orig=data.opportunities.find(x=>x.id===o.duplicate_of);box.append(el('p','تكرار محتمل لـ: '+(orig?orig.title:o.duplicate_of),'muted'));}
  if(session.user.role==='admin'){const d=el('details',undefined,'card');d.append(el('summary','مراجعة الجهة والشروط والنشر'));const db=el('div',undefined,'body');reviewForm(db,o);d.append(db);box.append(d);}
  if(o.review_status==='approved'){const matches=el('details',undefined,'card');matches.append(el('summary','مطابقة المشاريع وبدء التقييم'));const mb=el('div',undefined,'body');mb.append(el('p','المطابقة مقارنة حقول وليست حكمًا نهائيًا على الأهلية.','muted'));const wrap=el('div',undefined,'entries');for(const m of (data.matches[o.id]||[]).slice(0,10))wrap.append(matchRow(o,m));mb.append(wrap);matches.append(mb);box.append(matches);}
  area.append(box);}
 if(!data.opportunities.length)area.append(el('p','لم تصل فرص للمراجعة بعد. راجع مصادر الرصد وسجل الفحص.','empty'));
 if(location.hash){const target=document.getElementById(location.hash.slice(1));if(target)target.scrollIntoView({block:'start'});}}
(async()=>{session=await api('/api/session');radarShell({page:'workflow',title:'الفرص والمطابقة',role:session.user.role});$('monitor-link').hidden=session.user.role!=='admin';$('mine').onchange=renderApplications;
 $('ackAll').onclick=async()=>{try{await api('/api/workflow/alerts/ack-all',{});notice('تم إقرار كل التنبيهات المفتوحة',true);await load();}catch(e){notice(e.message);}};
 api('/api/news?limit=1').then(d=>{const last=d.runs&&d.runs[0];if(last&&window.radarShellFooter)radarShellFooter('آخر رصد حي: '+fmt(last.started_at));}).catch(()=>{});
 await load();})().catch(e=>{document.body.innerHTML='';const p=document.createElement('p');p.className='status error';p.textContent=e.message;document.body.append(p);});
</script></body></html>

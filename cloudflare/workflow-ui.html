<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفرص المرصودة ومتابعة التقديم</title><style>body{font:16px system-ui;background:#f6f8f8;color:#183039;margin:0}main{max-width:1150px;margin:auto;padding:24px}section,article{background:white;border:1px solid #dce5e4;border-radius:12px;padding:18px;margin:14px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #ccd6d5;border-radius:7px;max-width:100%;box-sizing:border-box}button{background:#116d63;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:6px;margin:10px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}a{color:#116d63}.muted{color:#64767d}#message{position:sticky;top:0;background:#fff7d6;padding:12px}summary{cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;align-items:center;margin:0;gap:4px;border:1px solid #ccd6d5;border-radius:999px;padding:4px 10px}.met{color:#116d63}.unmet{color:#a52b2b}.unknown{color:#8a6d00}.tl li{margin:4px 0}.badge{display:inline-block;border-radius:999px;padding:2px 10px;background:#eef3f2;margin-inline-end:6px;font-size:14px}fieldset{border:1px solid #dce5e4;border-radius:8px;grid-column:1/-1}h2{font-size:22px}</style></head><body><main><nav><a href="/">لوحة القرار</a> · <a href="/monitor" id="monitor-link" hidden>مصادر الرصد والأدلة</a></nav><h1>الفرص المرصودة ومتابعة التقديم</h1><p class="muted">تُراجع الفرصة قبل ظهورها للفريق. المطابقة ترشيح يحتاج تحققًا من الأهلية. قبول الطلب هنا لا يسجل تمويلًا ماليًا.</p><p id="message" role="status" hidden></p><section><h2>تنبيهات الرصد</h2><div id="alerts"></div></section><section><h2>طلبات التقديم والمهام</h2><label><input type="checkbox" id="mine"> عرض مهامي فقط</label><div id="applications"></div></section><section><h2>الفرص والمطابقة</h2><div id="opportunities"></div></section></main><script>
let session,data;const $=id=>document.getElementById(id),el=(t,text)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;return n;};
function notice(t){$('message').hidden=false;$('message').textContent=t;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':session.csrfToken}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل البيانات');return d;}
function field(form,name,label,value='',options){const l=el('label',label),n=el(options?'select':'input');n.name=name;if(options)for(const [v,t]of options){const o=el('option',t);o.value=v;n.append(o);}n.value=value;l.append(n);form.append(l);return n;}
function chips(form,name,legend,options,chosen=[]){const f=el('fieldset');f.append(el('legend',legend));const box=el('div');box.className='chips';for(const [v,t] of options){const l=el('label'),c=el('input');c.type='checkbox';c.name=name;c.value=v;c.checked=chosen.includes(v);l.append(c,document.createTextNode(t));box.append(l);}f.append(box);form.append(f);}
const picked=(form,name)=>[...form.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value);
const num=v=>v===''||v===undefined?null:Number(v);
const quoteOf=e=>(Array.isArray(e.excerpt)?e.excerpt.map(x=>x.quote||x.date||'').filter(Boolean).join(' | '):String(e.excerpt||'')).slice(0,60);
function link(url,label){const a=el('a',label);a.href=url;a.rel='noopener noreferrer';return a;}
function submit(form,label,fn,after){const b=el('button',label);form.append(b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await fn(Object.fromEntries(new FormData(form)));notice('تم الحفظ');await load();}catch(e){notice(e.message);}finally{b.disabled=false;}};}
const stageNames={eval:'تقييم',prep:'تجهيز',sent:'قُدم',accepted:'مقبول',rejected:'مرفوض',closed:'مغلق'},evNames={stage:'مرحلة',contact:'تواصل',note:'ملاحظة',result:'نتيجة'},verdictNames={candidate_ok:'مرشح مناسب — يحتاج تحققًا بشريًا',needs_review:'ينقصه توثيق',blocked:'غير مناسب حاليًا'},stNames={met:'متحقق',unmet:'غير متحقق',unknown:'غير موثق'};
function applicationForm(parent,o,app,projectId,prep){if(session.user.role==='viewer')return;const f=el('form');field(f,'projectId','المشروع',app?.project_id||projectId||'',data.projects.map(p=>[p.id,p.name]));field(f,'ownerId','المسؤول',app?.owner_id||session.user.id,data.members.map(m=>[m.id,m.displayName]));field(f,'stage','المرحلة',app?.stage||(prep?'prep':'eval'),Object.entries(stageNames).filter(([k])=>session.user.role==='admin'||k!=='accepted'));field(f,'nextAction','الخطوة التالية',app?.next_action||'');field(f,'dueDate','موعد المهمة',app?.due_date||'').type='date';field(f,'notes','ملاحظات المتابعة',app?.notes||'');if(app)f.elements.projectId.disabled=true;submit(f,app?'حفظ المتابعة':prep?'بدء التجهيز للنافذة القادمة':'بدء تقييم مستقل',v=>api('/api/workflow/applications',{...v,projectId:app?.project_id||v.projectId,opportunityId:o.id,expectedVersion:app?.version||0}));parent.append(f);}
function eventForm(parent,app){if(session.user.role==='viewer')return;const f=el('form');field(f,'kind','نوع السجل',"contact",[['contact','تواصل مع الجهة'],['note','ملاحظة'],['result','نتيجة الطلب']]);field(f,'result','النتيجة (للنتائج فقط)','',[['','—'],...(session.user.role==='admin'?[['accepted','مقبول']]:[]),['rejected','مرفوض']]);field(f,'text','التفاصيل','');submit(f,'تسجيل',v=>{const b={kind:v.kind,text:v.text};if(v.kind==='result')b.result=v.result;return api('/api/workflow/applications/'+app.id+'/events',b);});parent.append(f);}
function timeline(parent,app){const ul=el('ul');ul.className='tl';for(const e of data.events[app.id]||[])ul.append(el('li',e.at.slice(0,16).replace('T',' ')+' · '+(evNames[e.kind]||e.kind)+' · '+(e.actor_name||'')+' — '+(e.text||'')));if(!ul.children.length)ul.append(el('li','لا سجل بعد'));parent.append(ul);}
function renderAlerts(){const area=$('alerts');area.replaceChildren();for(const a of data.alerts||[]){const row=el('p',a.message+' ');if(session.user.role!=='viewer'){const b=el('button','تم الاطلاع');b.onclick=async()=>{try{await api('/api/workflow/alerts/'+a.id+'/ack',{});await load();}catch(e){notice(e.message);}};row.append(b);}area.append(row);}if(!area.children.length)area.append(el('p','لا تنبيهات مفتوحة.'));}
function renderApplications(){const area=$('applications');area.replaceChildren();const list=data.applications.filter(a=>!$('mine').checked||a.owner_id===session.user.id);for(const a of list){const o=data.opportunities.find(o=>o.id===a.opportunity_id)||{id:a.opportunity_id,title:'فرصة لم تعد منشورة'},p=data.projects.find(p=>p.id===a.project_id);const box=el('article');box.append(el('h3',o.title+' — '+(p?.name||a.project_id)),el('p',(stageNames[a.stage]||a.stage)+' · '+(data.members.find(m=>m.id===a.owner_id)?.displayName||'مسؤول غير نشط')),el('p',a.next_action+' · '+(a.due_date||'لم يحدد موعد')));const tl=el('details');tl.append(el('summary','سجل المتابعة والتواصل والنتائج'));timeline(tl,a);eventForm(tl,a);box.append(tl);if(o.review_status==='approved'){const details=el('details');details.append(el('summary','تحديث المتابعة'));applicationForm(details,o,a);box.append(details);}else box.append(el('p','المتابعة محفوظة؛ يلزم إعادة اعتماد الفرصة لتعديلها.'));area.append(box);}if(!list.length)area.append(el('p','لا توجد طلبات بعد. اختر فرصة معتمدة وابدأ تقييم مشروع.'));}
function reviewForm(parent,o){const f=el('form'),meta=JSON.parse(o.fields_json||'{}'),t=o.terms,E=data.enums,acc=(data.evidence||[]).filter(e=>e.opportunity_id===o.id&&e.review_status==='accepted');
 field(f,'donorId','الجهة المانحة',o.donor_id||'',[['','اختر الجهة'],...data.donors.map(d=>[d.id,d.name])]);
 chips(f,'topics','المجالات',Object.entries(data.tags||{}).map(([k,v])=>[k,typeof v==='string'?v:k]),meta.topics||[]);
 chips(f,'entityTypes','الجهات المؤهلة',Object.entries(E.entityTypes),t.entityTypes);chips(f,'audiences','الفئات المستهدفة',Object.entries(E.audiences),t.audiences);chips(f,'readiness','متطلبات الجاهزية',Object.entries(E.readiness),t.readiness);
 field(f,'scope','النطاق الجغرافي',t.region.scope,[['unknown','غير موثق'],['national','المملكة'],['regional','مناطق محددة']]);field(f,'regionNames','المناطق (مفصولة بفاصلة)',t.region.names.join('، '));
 field(f,'amountMin','أدنى مبلغ (ريال)',t.amount.min??'').type='number';field(f,'amountMax','أعلى مبلغ (ريال)',t.amount.max??'').type='number';field(f,'durMin','أقل مدة (أشهر)',t.durationMonths.min??'').type='number';field(f,'durMax','أطول مدة (أشهر)',t.durationMonths.max??'').type='number';
 field(f,'applicationStatus','حالة التقديم',t.applicationStatus,Object.entries(E.appStatus));field(f,'termsEvidence','نص الدليل على الشروط (اقتباس موجز)',t.evidence?.amount||'');
 field(f,'evidenceId','دليل التاريخ المعتمد',o.evidence_id||'',[['','بلا دليل (يلزم سبب)'],...acc.map(e=>[e.id,(e.closes_at||'بلا تاريخ')+' — '+quoteOf(e)])]);field(f,'noEvidenceReason','سبب غياب الدليل (10 أحرف فأكثر)','');
 field(f,'notes','ملاحظات التحقق',meta.notes||'');
 field(f,'decision','القرار',o.review_status==='rejected'?'rejected':'approved',[['approved','اعتماد ونشر للفريق'],['rejected','رفض / سحب'],['duplicate','تكرار لفرصة أخرى']]);
 field(f,'duplicateOf','الفرصة الأصلية (للتكرار)',o.duplicate_of||'',[['','—'],...data.opportunities.filter(x=>x.id!==o.id).map(x=>[x.id,x.title])]);
 submit(f,'حفظ المراجعة',v=>{if(v.decision==='rejected')return api('/api/workflow/opportunities/'+o.id,{decision:'rejected',expectedVersion:o.version});if(v.decision==='duplicate')return api('/api/workflow/opportunities/'+o.id,{decision:'duplicate',duplicateOf:v.duplicateOf,expectedVersion:o.version});
  const names=v.regionNames.split(/[,،]/).map(x=>x.trim()).filter(Boolean),terms={entityTypes:picked(f,'entityTypes'),audiences:picked(f,'audiences'),readiness:picked(f,'readiness'),region:{scope:v.scope,names},amount:{min:num(v.amountMin),max:num(v.amountMax)},durationMonths:{min:num(v.durMin),max:num(v.durMax)},applicationStatus:v.applicationStatus,evidence:v.termsEvidence?{amount:v.termsEvidence}:{}};
  const b={decision:'approved',donorId:v.donorId,topics:picked(f,'topics'),notes:v.notes,terms,expectedVersion:o.version};if(v.evidenceId)b.evidenceId=v.evidenceId;else b.noEvidenceReason=v.noEvidenceReason;return api('/api/workflow/opportunities/'+o.id,b);});parent.append(f);}
function matchRow(o,m){const row=el('article');row.append(el('h3',m.name),el('p',verdictNames[m.verdict]+' · تغطية التوثيق '+m.coverage+'%'));if(m.closed)row.append(el('p',o.closes_at?'انتهى الموعد المعتمد؛ تحقق من التجديد':'التقديم مغلق بحسب المراجعة؛ تابع النافذة القادمة'));const d=el('details');d.append(el('summary','تفصيل المعايير'));const ul=el('ul');for(const c of m.criteria){const li=el('li',c.label+': '+stNames[c.status]+' — '+c.detail);li.className=c.status;ul.append(li);}d.append(ul);row.append(d);if(m.blockers.length)row.append(el('p','موانع: '+m.blockers.join('؛ ')));const existing=data.applications.find(a=>a.project_id===m.projectId&&a.opportunity_id===o.id);if(existing)row.append(el('p','توجد متابعة لهذا المشروع في طلبات التقديم أعلاه'));else if(m.verdict!=='blocked')applicationForm(row,o,null,m.projectId);else if(m.closed&&m.criteria.every(c=>c.status!=='unmet'||c.key==='status')){row.append(el('p','التقديم مغلق الآن والمعايير الأخرى لا تمنع؛ يمكن بدء التجهيز للنافذة القادمة دون تقديم.'));applicationForm(row,o,null,m.projectId,true);}return row;}
async function load(){data=await api('/api/workflow');renderAlerts();renderApplications();const area=$('opportunities');area.replaceChildren();for(const o of data.opportunities){const box=el('article');box.id='opportunity-'+o.id;const st=el('p');for(const t of [({approved:'معتمدة',pending:'بانتظار المراجعة',rejected:'مرفوضة'})[o.review_status],o.duplicate_of?'مكررة':null,data.enums.appStatus[o.status]].filter(Boolean)){const b=el('span',t);b.className='badge';st.append(b);}box.append(el('h3',o.title),st,link(o.source_url,'فتح إعلان المصدر'),el('p','موعد الإغلاق المعتمد: '+(o.closes_at||'غير موثق')));if(o.duplicate_of){const orig=data.opportunities.find(x=>x.id===o.duplicate_of);box.append(el('p','تكرار محتمل لـ: '+(orig?orig.title:o.duplicate_of)));}
 if(session.user.role==='admin'){const details=el('details');details.append(el('summary','مراجعة الجهة والشروط والنشر'));reviewForm(details,o);box.append(details);}
 if(o.review_status==='approved'){const matches=el('details');matches.append(el('summary','مطابقة المشاريع وبدء التقييم'));matches.append(el('p','المطابقة مقارنة حقول وليست حكمًا نهائيًا على الأهلية.'));for(const m of (data.matches[o.id]||[]).slice(0,10))matches.append(matchRow(o,m));box.append(matches);}area.append(box);}if(!data.opportunities.length)area.append(el('p','لم تصل فرص للمراجعة بعد. راجع مصادر الرصد وسجل الفحص.'));}
$('mine').onchange=renderApplications;(async()=>{session=await api('/api/session');$('monitor-link').hidden=session.user.role!=='admin';await load();})().catch(e=>notice(e.message));
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفرص المرصودة ومتابعة التقديم</title><style>body{font:16px system-ui;background:#f6f8f8;color:#183039;margin:0}main{max-width:1150px;margin:auto;padding:24px}section,article{background:white;border:1px solid #dce5e4;border-radius:12px;padding:18px;margin:14px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #ccd6d5;border-radius:7px;max-width:100%;box-sizing:border-box}button{background:#116d63;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:6px;margin:10px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}a{color:#116d63}.muted{color:#64767d}#message{position:sticky;top:0;background:#fff7d6;padding:12px}summary{cursor:pointer}h2{font-size:22px}</style></head><body><main><nav><a href="/">لوحة القرار</a> · <a href="/monitor" id="monitor-link" hidden>مصادر الرصد والأدلة</a></nav><h1>الفرص المرصودة ومتابعة التقديم</h1><p class="muted">تُراجع الفرصة قبل ظهورها للفريق. المطابقة ترشيح يحتاج تحققًا من الأهلية. قبول الطلب هنا لا يسجل تمويلًا ماليًا.</p><p id="message" role="status" hidden></p><section><h2>طلبات التقديم والمهام</h2><label><input type="checkbox" id="mine"> عرض مهامي فقط</label><div id="applications"></div></section><section><h2>الفرص والمطابقة</h2><div id="opportunities"></div></section></main><script>
let session,data;const $=id=>document.getElementById(id),el=(t,text)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;return n;};
function notice(t){$('message').hidden=false;$('message').textContent=t;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':session.csrfToken}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل البيانات');return d;}
function field(form,name,label,value='',options){const l=el('label',label),n=el(options?'select':'input');n.name=name;if(options)for(const [v,t]of options){const o=el('option',t);o.value=v;n.append(o);}n.value=value;l.append(n);form.append(l);return n;}
function link(url,label){const a=el('a',label);a.href=url;a.rel='noopener noreferrer';return a;}
function submit(form,label,fn){const b=el('button',label);form.append(b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await fn(Object.fromEntries(new FormData(form)));notice('تم الحفظ');await load();}catch(e){notice(e.message);}finally{b.disabled=false;}};}
const stageNames={eval:'تقييم',prep:'تجهيز',sent:'قُدم',accepted:'مقبول',rejected:'مرفوض',closed:'مغلق'};
function applicationForm(parent,o,app,projectId){if(session.user.role==='viewer')return;const f=el('form');field(f,'projectId','المشروع',app?.project_id||projectId||'',data.projects.map(p=>[p.id,p.name]));field(f,'ownerId','المسؤول',app?.owner_id||session.user.id,data.members.map(m=>[m.id,m.displayName]));field(f,'stage','المرحلة',app?.stage||'eval',Object.entries(stageNames).filter(([k])=>session.user.role==='admin'||k!=='accepted'));field(f,'nextAction','الخطوة التالية',app?.next_action||'');field(f,'dueDate','موعد المهمة',app?.due_date||'').type='date';field(f,'notes','ملاحظات المتابعة',app?.notes||'');if(app)f.elements.projectId.disabled=true;submit(f,app?'حفظ المتابعة':'بدء تقييم مستقل',v=>api('/api/workflow/applications',{...v,projectId:app?.project_id||v.projectId,opportunityId:o.id,expectedVersion:app?.version||0}));parent.append(f);}
function renderApplications(){const area=$('applications');area.replaceChildren();const list=data.applications.filter(a=>!$('mine').checked||a.owner_id===session.user.id);for(const a of list){const o=data.opportunities.find(o=>o.id===a.opportunity_id)||{id:a.opportunity_id,title:'فرصة لم تعد منشورة'},p=data.projects.find(p=>p.id===a.project_id);const box=el('article');box.append(el('h3',o.title+' — '+(p?.name||a.project_id)),el('p',(stageNames[a.stage]||a.stage)+' · '+(data.members.find(m=>m.id===a.owner_id)?.displayName||'مسؤول غير نشط')),el('p',a.next_action+' · '+(a.due_date||'لم يحدد موعد')));if(o.review_status==='approved'){const details=el('details');details.append(el('summary','تحديث المتابعة'));applicationForm(details,o,a);box.append(details);}else box.append(el('p','المتابعة محفوظة؛ يلزم إعادة اعتماد الفرصة لتعديلها.'));area.append(box);}if(!list.length)area.append(el('p','لا توجد طلبات بعد. اختر فرصة معتمدة وابدأ تقييم مشروع.'));}
async function load(){data=await api('/api/workflow');renderApplications();const area=$('opportunities');area.replaceChildren();for(const o of data.opportunities){const box=el('article');box.id='opportunity-'+o.id;box.append(el('h3',o.title),el('p',({approved:'معتمدة',pending:'بانتظار المراجعة',rejected:'مرفوضة'})[o.review_status]),link(o.source_url,'فتح إعلان المصدر'),el('p','موعد الإغلاق المعتمد: '+(o.closes_at||'غير موثق')));if(session.user.role==='admin'){const details=el('details');details.append(el('summary','مراجعة الجهة والشروط والنشر'));const f=el('form'),meta=JSON.parse(o.fields_json||'{}');field(f,'donorId','الجهة المانحة',o.donor_id||'',[['','اختر الجهة'],...data.donors.map(d=>[d.id,d.name])]);field(f,'topics','رموز المجالات (مفصولة بفاصلة)',(meta.topics||[]).join(','));field(f,'eligibility','شروط الأهلية',meta.eligibility||'');field(f,'region','النطاق الجغرافي',meta.region||'');field(f,'audience','الفئة المستهدفة',meta.audience||'');field(f,'notes','ملاحظات التحقق',meta.notes||'');field(f,'evidenceId','معرّف دليل تاريخ معتمد للإعلان نفسه',o.evidence_id||'');field(f,'decision','القرار',o.review_status==='rejected'?'rejected':'approved',[['approved','اعتماد ونشر للفريق'],['rejected','رفض / سحب من القائمة']]);submit(f,'حفظ المراجعة',v=>api('/api/workflow/opportunities/'+o.id,{...v,topics:v.topics.split(/[,،]/).map(x=>x.trim()).filter(Boolean),expectedVersion:o.version}));details.append(el('p','المجالات المتاحة: '+Object.entries(data.tags||{}).map(([k,v])=>k+' ('+(typeof v==='string'?v:k)+')').join('، ')),f);box.append(details);}
 if(o.review_status==='approved'){const matches=el('details');matches.append(el('summary','مطابقة المشاريع وبدء التقييم'));for(const m of (data.matches[o.id]||[]).slice(0,10)){const row=el('article');row.append(el('h3',m.name),el('p','توافق المجالات: '+m.score+'% — '+m.reasons.join('؛ ')),el('p',m.closed?'انتهى الموعد المعتمد؛ تحقق من التجديد':m.gaps.join('؛ ')));const existing=data.applications.find(a=>a.project_id===m.projectId&&a.opportunity_id===o.id);if(existing)row.append(el('p','توجد متابعة لهذا المشروع في طلبات التقديم أعلاه'));else applicationForm(row,o,null,m.projectId);matches.append(row);}box.append(matches);}area.append(box);}if(!data.opportunities.length)area.append(el('p','لم تصل فرص للمراجعة بعد. راجع مصادر الرصد وسجل الفحص.'));}
$('mine').onchange=renderApplications;(async()=>{session=await api('/api/session');$('monitor-link').hidden=session.user.role!=='admin';await load();})().catch(e=>notice(e.message));
</script></body></html>
